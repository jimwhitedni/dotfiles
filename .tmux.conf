# Prefix 改為 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 滑鼠支援
set -g mouse on

# 分割
#
# 在側欄裡按的話，切的是右邊那格：側欄要維持「最左、滿高」，被切成兩半就壞了。
bind | if -F '#{@ccm-sidebar}' { select-pane -R ; split-window -h -c "#{pane_current_path}" } { split-window -h -c "#{pane_current_path}" }
bind - if -F '#{@ccm-sidebar}' { select-pane -R ; split-window -v -c "#{pane_current_path}" } { split-window -v -c "#{pane_current_path}" }

# vim 方向鍵切換 pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim 方向鍵調整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 新 window 保持當前目錄，而且一出現就帶著側欄。
#
# 寬度從 @ccm-width 讀（側欄改寬度時會更新它）。側欄關掉時（cc-monitor --sidebars
# off）就只開 window。就算這裡沒加到，hook 也會在一秒內補上。
bind c new-window -c "#{pane_current_path}" \; if -F '#{!=:#{@ccm-enabled},0}' { split-window -d -h -b -f -l "#{@ccm-width}" -c "#{pane_current_path}" "exec $HOME/.local/bin/cc-monitor --sidebar" }

# 色彩支援（Ghostty 優化）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# 狀態列
set -g status-style 'bg=#282a36 fg=#f8f8f2'
set -g status-left '#[fg=#50fa7b,bold][#S] '
set -g status-right '#[fg=#bd93f9]%H:%M '
set -g status-left-length 20
setw -g window-status-current-style 'fg=#50fa7b bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# 從 1 開始編號
set -g base-index 1
setw -g pane-base-index 1

# 快速 reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 歷史行數
set -g history-limit 50000

# nvim friendly
set -sg escape-time 0

# 自動重新編號
set -g renumber-windows on

# 清除 pane title（隱藏 hostname）
#
# 用一個空白而不是空字串：resurrect 的存檔是用 tab 分隔、用 `IFS=$'\t' read` 讀回
# 來，空的欄位會被吃掉、後面整列往前移 —— title 是空的，cwd 就跑到 title 的位置，
# session 還原後會落在別的目錄。
#
# 每個 hook 都要寫 index：沒寫 index 的 set-hook 會把整串清掉再設第一個，重新載入設定
# 時就會把下面 [10] 那些側欄的 hook 一起清掉。
set-hook -g after-new-window[0] "select-pane -T ' '"
set-hook -g after-new-session[0] "select-pane -T ' '"
set-hook -g after-split-window[0] "select-pane -T ' '"

# Session 被摧毀時不要把 client 踢出 tmux，自動切到另一個 session 就好。
#
# 預設的 on 會在你所在的 session 消失時（例如 dev --reap 收掉一個 worktree）把你
# 整個丟回 shell。off 只是切到另一個 session，繼續待在 tmux 裡。
set -g detach-on-destroy off

# ===== 側欄：每個 window 最左邊那一格 =====
#
# 每個 window 都是 [側欄 | 你的 pane]。側欄是 cc-monitor --sidebar，每個 window 各跑
# 一份、畫的內容一樣，所以不管 client 在看哪個 window，清單都在旁邊；切到別的
# session 就是把 client 移過去，那裡本來就有自己的側欄。沒有任何 pane 被搬動。
#
# 這些 hook 讓「每個 window 剛好一個側欄」一直成立：新 session / window 補上側欄、
# 你的 pane 都關了就把側欄也收掉、側欄 crash 就在原位重生。輸出全部丟掉，否則
# run-shell 的輸出會把 pane 切進 view mode。
#
# 每一個都帶 #{start_time}：tmux 剛啟動的前幾秒 cc-monitor 不能執行任何 tmux 指令 ——
# continuum 會數 tmux 行程，多一個就靜默跳過還原，你所有 session 就沒了。只帶在
# after-new-session 上是不夠的：一個 new-session 同時也會觸發 window-linked。
set -g @ccm-width 42
set-hook -g after-new-session[10] 'run-shell -b "$HOME/.local/bin/cc-monitor --ensure-sidebars --server-start #{start_time} >/dev/null 2>&1; true"'
set-hook -g after-new-window[10] 'run-shell -b "$HOME/.local/bin/cc-monitor --ensure-sidebars --server-start #{start_time} >/dev/null 2>&1; true"'
set-hook -g window-linked[10] 'run-shell -b "$HOME/.local/bin/cc-monitor --ensure-sidebars --server-start #{start_time} >/dev/null 2>&1; true"'
set-hook -g after-kill-pane[10] 'run-shell -b "$HOME/.local/bin/cc-monitor --ensure-sidebars --server-start #{start_time} >/dev/null 2>&1; true"'
set-hook -g pane-exited[10] 'run-shell -b "$HOME/.local/bin/cc-monitor --ensure-sidebars --server-start #{start_time} >/dev/null 2>&1; true"'
set-hook -g pane-died[10] 'run-shell -b "$HOME/.local/bin/cc-monitor --sidebar-died #{hook_pane} >/dev/null 2>&1; true"'

# 你拖動分隔線或按 C-a H/L 時，tmux 跑的都是 resize-pane。只有這種時候側欄才會採用新寬度
# （然後套用到每個 window）；其他原因造成的寬度變化 —— window 變大、旁邊的 pane 關掉把
# 空間讓給它、套用版面 —— 一律彈回原本的寬度。純 tmux，不啟動任何行程。
set-hook -g after-resize-pane[10] 'set-option -w @ccm-user-resized 1'

# 回清單：從 session 回到側欄。被 zoom 的時候先還原，否則 {left} 會是被 zoom 的那格。
# 落到的那格不是活著的清單時（側欄當掉、被關掉）交給 cc-monitor：把它叫回來再過去。
# 平常只是純 tmux，不啟動任何行程；這個鍵按了一定回到清單。
bind m if -F '#{window_zoomed_flag}' { resize-pane -Z } \; select-pane -t '{left}' \; if -F '#{||:#{!=:#{@ccm-sidebar},1},#{pane_dead}}' { run-shell -b "$HOME/.local/bin/cc-monitor --focus-list '#{pane_id}' '#{client_name}' >/dev/null 2>&1; true" }

# ===== Plugins (TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 每 15 分鐘自動存檔，tmux server 啟動時自動還原。
#
# 還原的是 session、window、cwd 與版面 —— 不是 Claude 的對話。Claude 不在
# resurrect 的 process 白名單裡，而且本來就是手動起的，所以還原後你會得到一個
# 停在正確目錄的 shell，自己決定要不要 claude --continue 接回去。
set -g @continuum-restore 'on'

# 刻意不開 @resurrect-capture-pane-contents：
# 還原出來的會是「上次 Claude 畫面的靜態快照」貼在一個沒有 Claude 的 shell 裡，
# 看起來像還在跑但其實不是。一個乾淨的 shell 比一張會騙人的截圖好。

# 回收 worktree 後記得讓它存一次檔（prefix C-s），否則下次還原會把剛刪掉的
# worktree 的 session 復活回來。

# resurrect 不知道側欄是什麼，這三個 hook 讓還原後每個 window 還是剛好一個側欄：
# 存檔時把側欄那一格標出來（順便把空的 title 補成空白），還原前先擋住新增側欄，
# 還原後把留下來的那一格認領回來當側欄，而不是在旁邊再加一個。
set -g @resurrect-hook-post-save-layout '$HOME/.local/bin/cc-monitor --annotate-save'
set -g @resurrect-hook-pre-restore-all '$HOME/.local/bin/cc-monitor --before-restore $$'
set -g @resurrect-hook-post-restore-all '$HOME/.local/bin/cc-monitor --after-restore'

run '~/.tmux/plugins/tpm/tpm'
