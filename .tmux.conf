# Prefix 改為 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 滑鼠支援
set -g mouse on

# 分割
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim 方向鍵切換 pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim 方向鍵調整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 新 window 保持當前目錄
bind c new-window -c "#{pane_current_path}"

# 色彩支援（Ghostty 優化）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# 狀態列
set -g status-style 'bg=#282a36 fg=#f8f8f2'
set -g status-left '#[fg=#50fa7b,bold][#S] '
set -g status-right '#[fg=#bd93f9]%H:%M '
set -g status-left-length 20
setw -g window-status-current-style 'fg=#50fa7b bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# 從 1 開始編號
set -g base-index 1
setw -g pane-base-index 1

# 快速 reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 歷史行數
set -g history-limit 50000

# nvim friendly
set -sg escape-time 0

# 自動重新編號
set -g renumber-windows on

# 清除 pane title（隱藏 hostname）
set-hook -g after-new-window "select-pane -T ''"
set-hook -g after-new-session "select-pane -T ''"
set-hook -g after-split-window "select-pane -T ''"

# Session 被摧毀時不要把 client 踢出 tmux，自動切到另一個 session 就好。
#
# 預設的 on 會在你所在的 session 消失時（例如 dev --reap 收掉一個 worktree）把你
# 整個丟回 shell。off 只是切到另一個 session，繼續待在 tmux 裡。
set -g detach-on-destroy off

# 回主控台，沒在跑就順手開一個。
#
# 這一個鍵就夠了，不必在哪裡留一格 shell 來打 ccm —— 從任何 Claude 的 pane 都能按。
# 而且 ccm 本身在 tmux 裡是叫不動的：它走 new-session 會 attach，tmux 回你
# "sessions should be nested with care" 然後什麼都不做。這裡走 switch-client。
#
# switch-client 不會動到你離開的那個 session，它只是把 client 移過去。
bind m run-shell "tmux has-session -t '=monitor' 2>/dev/null || tmux new-session -d -s monitor 'cc-monitor; exec zsh -i'; tmux switch-client -t '=monitor'"

# ===== Plugins (TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 每 15 分鐘自動存檔，tmux server 啟動時自動還原。
#
# 還原的是 session、window、cwd 與版面 —— 不是 Claude 的對話。Claude 不在
# resurrect 的 process 白名單裡，而且本來就是手動起的，所以還原後你會得到一個
# 停在正確目錄的 shell，自己決定要不要 claude --continue 接回去。
set -g @continuum-restore 'on'

# 刻意不開 @resurrect-capture-pane-contents：
# 還原出來的會是「上次 Claude 畫面的靜態快照」貼在一個沒有 Claude 的 shell 裡，
# 看起來像還在跑但其實不是。一個乾淨的 shell 比一張會騙人的截圖好。

# 回收 worktree 後記得讓它存一次檔（prefix C-s），否則下次還原會把剛刪掉的
# worktree 的 session 復活回來。
run '~/.tmux/plugins/tpm/tpm'
